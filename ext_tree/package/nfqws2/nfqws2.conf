# nfqws2 configuration for PureFox
# Multi-strategy approach (adapted from nfqws2-keenetic)
# nfqws2 tries strategies in order: 1 -> 2 -> 3
#
# NOTE: DPI bypass works for local traffic (PureFox itself).
# Forwarded LAN traffic with single interface cannot be NATted
# through nfqws2 raw sockets — use separate subnet/bridge for gateway mode.
ISP_INTERFACE="eth0"

NFQWS_BASE_ARGS="--bind-fix4 --lua-init=@/etc/nfqws2/lua/zapret-lib.lua --lua-init=@/etc/nfqws2/lua/zapret-antidpi.lua --lua-init=@/etc/nfqws2/lua/zapret-auto.lua --blob=quic_initial:@/etc/nfqws2/blobs/quic_initial.bin --blob=tls_clienthello:@/etc/nfqws2/blobs/tls_clienthello.bin"

NFQWS_ARGS="--filter-tcp=443 --filter-l7=tls --payload=tls_client_hello --lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=fonts.google.com:tcp_seq=10000:strategy=1 --lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=1 --lua-desync=fake:blob=0x00000000:tcp_ack=-66000:tls_mod=rnd,dupsid,sni=www.google.com:repeats=2:strategy=2 --lua-desync=multisplit:pos=1,midsld:strategy=2 --lua-desync=hostfakesplit:host=ozon.ru:midhost=host-2:seqovl=sniext+3:seqovl_pattern=tls_clienthello:badsum:tcp_md5:tcp_ts_up:strategy=3 --lua-desync=hostfakesplit:tcp_md5:tcp_ts_up:strategy=3"

NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic --payload=quic_initial --lua-desync=fake:blob=quic_initial:repeats=11"

NFQWS_ARGS_UDP=""

MODE_LIST="--hostlist=/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/var/log/nfqws2.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_AUTO"

NFQWS_ARGS_IPSET="--ipset=/etc/nfqws2/lists/ipset.list --ipset-exclude=/etc/nfqws2/lists/ipset_exclude.list"

NFQWS_ARGS_CUSTOM="--new --filter-tcp=80 --filter-l7=http --payload=http_req --lua-desync=http_methodeol:badsum"

IPV6_ENABLED=0
TCP_PORTS=80,443
UDP_PORTS=443
NFQUEUE_NUM=300
