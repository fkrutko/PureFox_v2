# MPD for Yandex Music (yandex.php, ymusicd): no music database, the queue
# holds http://127.0.0.1:6601/track/... streams

# State file (RW)
state_file		"/tmp/mpd_state"

# TCP socket binding
bind_to_address		"any"

# Unix socket to listen on
bind_to_address		"/tmp/mpd_socket"

# The output selected in /etc/asound.conf, no software volume
audio_output {
	type		"alsa"
	name		"PureFox"
	device		"default"
	mixer_type	"none"
}
