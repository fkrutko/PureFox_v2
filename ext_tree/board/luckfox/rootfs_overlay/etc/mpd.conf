# MPD for Yandex Music (ymusicd): no music database, the queue
# holds http://127.0.0.1:6601/track/... streams

# State file (RW)
state_file		"/tmp/mpd_state"

# TCP socket binding
bind_to_address		"any"

# Unix socket to listen on
bind_to_address		"/tmp/mpd_socket"

# Bit-perfect: no volume of any kind, no ReplayGain or normalization
replaygain		"off"
volume_normalization	"no"

# The output selected in /etc/asound.conf, no mixer (MPD never scales
# samples) and no ALSA plug conversions: the decoded stream reaches the
# DAC as is (only zero-padded to a wider sample container if needed)
audio_output {
	type		"alsa"
	name		"PureFox"
	device		"default"
	mixer_type	"none"
	auto_resample	"no"
	auto_channels	"no"
	auto_format	"no"
}
