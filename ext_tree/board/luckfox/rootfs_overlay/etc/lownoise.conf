### Low noise tab of the web page, see /opt/lownoise.sh ###

### CPU frequency cap in kHz, 0 = kernel default ###
CPU_MAX_FREQ=0

### SCLK, LRCK and data pin drive strength: default (level 2) or 0..7 ###
I2S_DRIVE=default

### MCLK pin drive strength: default (level 3) or 0..7 ###
MCLK_DRIVE=default

### Fewest DMA periods per buffer: 16 (default), 8, 4, 2 ###
DMA_PERIODS=16

### Scream resampling of rates the output does not take: 1 (default) or 0 ###
SCREAM_RESAMPLE=1
