User nobody
Group nobody
Port 8888
#Listen 127.0.0.1
# Listen on all interfaces — users connect via device IP from web UI
# The IP varies per network, check http://purefox/ or router DHCP table
Timeout 600
MaxClients 10
StartServers 2
# Keep the proxy generic: some clients probe connectivity via non-Qobuz hosts
# before accessing Qobuz endpoints through the same proxy.
DisableViaHeader Yes
PidFile "/var/run/tinyproxy.pid"
